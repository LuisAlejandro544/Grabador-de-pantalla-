name: Compilar APK Debug (Sin Cache con Firma Dinámica)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # Permite disparar la compilación manualmente desde el móvil o web

jobs:
  build-debug-apk:
    name: Compilación APK Debug Multi-Arquitectura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar variables del Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Descargar dependencias de C++ (NDK y CMake)
        run: |
          echo "=== Instalando NDK y CMake para compilación nativa C++ ==="
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393" "platforms;android-36" "platforms;android-29" "build-tools;36.0.0"

      - name: Forzar generación de firma Debug desde cero (Sin caché ni reutilización)
        run: |
          echo "=== Generando firma debug desde cero mediante generate_keystore.sh ==="
          chmod +x ./scripts/generate_keystore.sh
          ./scripts/generate_keystore.sh "$GITHUB_WORKSPACE"

      - name: Configurar Gradle (Sin Caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
          cache-disabled: true

      - name: Compilar APK Debug (Sin Caché y con Verificación C++)
        run: |
          echo "=== Compilando APK Debug con soporte C++ (arm64-v8a, armeabi-v7a, x86_64, x86) ==="
          gradle :app:assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Verificar generación de APK
        run: |
          echo "=== Listado de archivos generados ==="
          ls -lh app/build/outputs/apk/debug/

      - name: Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: GrabadorPantalla-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
